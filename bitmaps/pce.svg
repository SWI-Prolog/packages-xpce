<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The XPCE logo (64x64): a window, an arrow and a
       blob, and the three St Andrew's crosses of Amsterdam in the U of
       the University of Amsterdam, carrying the letters P, C and E. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3ebf5"/>
    </linearGradient>
    <linearGradient id="blob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd46f"/>
      <stop offset="1" stop-color="#2f8f4e"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="61" height="61" rx="6" fill="url(#bg)"
        stroke="#2c4f7c" stroke-width="2"/>
  <!-- the window -->
  <rect x="6" y="7.5" width="29" height="16" rx="2" fill="#ffffff"
        stroke="#2f6db5" stroke-width="1.5"/>
  <path d="M6.75 10.6 V9.5 A1.25 1.25 0 0 1 8 8.25 H33 A1.25 1.25 0 0 1 34.25 9.5 V10.6 Z"
        fill="#2f6db5"/>
  <path d="M10 14.5 H22 M10 17.5 H27 M10 20.5 H19" fill="none"
        stroke="#9fb3cf" stroke-width="1.5" stroke-linecap="round"/>
  <!-- the arrow -->
  <path d="M20.5 24 V32" fill="none" stroke="#3d4450" stroke-width="2"/>
  <path d="M16.5 31 H24.5 L20.5 36 Z" fill="#3d4450"/>
  <!-- the object world -->
  <path d="M6 44 C5 39 11 37.5 15 39 C18 36 25 36.5 28 39.5 C33 38.5 37 42 35.5 46
           C38 50 34 55 29 54 C26 57.5 18 57.5 15.5 54.5 C10 56 4.5 52 6.5 48.5
           C4.5 47.5 4.5 45.5 6 44 Z"
        fill="url(#blob)" stroke="#23663a" stroke-width="1.2"/>
  <circle cx="14" cy="45" r="1.6" fill="#ffffff" opacity="0.8"/>
  <circle cx="22" cy="48.5" r="1.6" fill="#ffffff" opacity="0.8"/>
  <circle cx="29" cy="45" r="1.6" fill="#ffffff" opacity="0.8"/>
  <path d="M14 45 L22 48.5 L29 45" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.8"/>
  <!-- the crosses of Amsterdam in the U of the university -->
  <path d="M39.5 24.5 V38 A4 4 0 0 0 43.5 42 H54.5 A4 4 0 0 0 58.5 38 V24.5"
        fill="none" stroke="#1d2433" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="translate(49 12)">
    <rect x="-2.8" y="-9.5" width="5.6" height="19" rx="2.8" transform="rotate(45)" fill="#d7191f"/>
    <rect x="-2.8" y="-9.5" width="5.6" height="19" rx="2.8" transform="rotate(-45)" fill="#d7191f"/>
    <circle r="5.2" fill="#a3121a"/>
  </g>
  <g transform="translate(49 32)">
    <rect x="-2.8" y="-9.5" width="5.6" height="19" rx="2.8" transform="rotate(45)" fill="#d7191f"/>
    <rect x="-2.8" y="-9.5" width="5.6" height="19" rx="2.8" transform="rotate(-45)" fill="#d7191f"/>
    <circle r="5.2" fill="#a3121a"/>
  </g>
  <g transform="translate(49 52)">
    <rect x="-2.8" y="-9.5" width="5.6" height="19" rx="2.8" transform="rotate(45)" fill="#d7191f"/>
    <rect x="-2.8" y="-9.5" width="5.6" height="19" rx="2.8" transform="rotate(-45)" fill="#d7191f"/>
    <circle r="5.2" fill="#a3121a"/>
  </g>
  <path d="M47.2 15 V9 H49.3 A1.8 1.8 0 0 1 49.3 12.6 H47.2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M51.1 30.0 A3 3 0 1 0 51.1 34.0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M51 49 H47.2 V55 H51 M47.2 52 H50.3" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
